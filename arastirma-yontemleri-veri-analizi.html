<script>
const qs = [
{q:`Değişken kavramı ile ilgili olarak yukarıda verilenlerden hangisi/hangileri doğrudur?<br><br>I- Değişkenler sahip oldukları değerlere göre nicel ve nitel olarak ikiye ayrılırlar.<br>II- Kontrol altında tutulup tutulamalarına göre bağımlı ve bağımsız değişkenler olarak iki gruba ayrılır.<br>III- Bağımsız değişkenler, deney değişkeni olarak da isimlendirilirler.`,o:["Yalnız I","Yalnız III","II ve III","I ve III","I, II ve III"],a:4,t:`<strong>Değişken nedir?</strong> Araştırmada değişken, gözlem birimleri arasında farklı değerler alabilen özellik veya niteliktir. Örneğin öğrencilerin yaşı, sınav puanı, cinsiyeti, çalışma süresi ve başarı düzeyi birer değişken olabilir. Değişkenleri sınıflandırırken iki farklı bakış açısını birbirine karıştırmamak gerekir. <strong>Nicel–nitel ayrımı</strong>, değişkenin aldığı verinin niteliğiyle ilgilidir. Nicel değişken sayısal olarak ifade edilebilir; nitel değişken ise kategori veya özellik bildirir. <strong>Bağımsız–bağımlı ayrımı</strong> ise araştırmadaki ilişkiyle ilgilidir. Bağımsız değişken etkisi/etkisi incelenen değişken; bağımlı değişken ise bu etkiden sonuç olarak etkilendiği düşünülen değişkendir. Deneysel çalışmalarda araştırmacının değiştirdiği veya düzeylerini karşılaştırdığı değişken çoğunlukla bağımsız değişkendir ve deney değişkeni olarak da anılabilir. Bu nedenle I, II ve III birlikte değerlendirilir. <strong>Kritik ayrım:</strong> “nicel-nitel” ile “bağımlı-bağımsız” aynı sınıflandırmanın iki adı değildir; biri verinin yapısını, diğeri araştırmadaki rolünü anlatır.`,m:`Hafıza kancası: “Nicel–nitel = nasıl ölçülüyor?”, “bağımlı–bağımsız = araştırmada ne yapıyor?”`},
{q:`Yukarıdakilerden hangisi/hangileri iyi hazırlanan bir ankette bulunan ana başlıklar içerisindedir?<br><br>I- Anketin yazılma amacına dair açıklama.<br>II- Anketin cevaplanma şekline dair açıklama.<br>III- Demografik sorular.<br>IV- Asıl amaca bağlı sorular.`,o:["Yalnız I","I ve II","II ve III","II, III ve IV","I, II, III ve IV"],a:4,t:`<strong>İyi bir anket yalnızca soru listesinden oluşmaz.</strong> Anketin girişinde katılımcının araştırmanın ne amaçla yapıldığını anlamasını sağlayan açıklama bulunması, cevaplama biçiminin açıkça belirtilmesi ve gerekiyorsa demografik bilgilerin toplanması gerekir. Ardından araştırmanın temel amacını ölçen asıl sorular gelir. Demografik sorular yaş, eğitim durumu, görev, deneyim gibi araştırmanın amacıyla ilişkili tanımlayıcı bilgileri elde etmek için kullanılabilir; ancak gereksiz kişisel bilgi sorulması doğru bir yaklaşım değildir. Soruların sırası da önemlidir: katılımcıyı hazırlayan ve kolay anlaşılır sorulardan daha özel veya ayrıntılı sorulara geçmek cevap kalitesini artırabilir. Ayrıca soru ifadeleri yönlendirici, belirsiz veya iki farklı şeyi aynı anda soran biçimde olmamalıdır. Dolayısıyla I, II, III ve IV anketin temel bölümlerini anlamak açısından birlikte düşünülür. <strong>Hafıza kancası:</strong> iyi anketin mantığı “Amaç → Nasıl cevaplanacak? → Katılımcı hakkında gerekli bilgiler → Araştırmanın asıl soruları” şeklindedir.`,m:`Anketi bir yol haritası gibi düşünün: “Neden cevaplıyorum? Nasıl cevaplayacağım? Kimim? Araştırmanın asıl sorusu ne?”`},
{q:`Aşağıda görüşme yöntemi ile ilgili olarak verilenlerden hangisi yanlıştır?`,o:["Görüşmedeki sorular, konuşma tarzında olmamalıdır.","Görüşme esnasında olası yan konulara geçiş noktasında dikkatli olunmalı ve odak, ana konu üzerinden toplanmalıdır.","Görüşme sonunda, görüşmecinin rahatsız olduğu konular hakkında ya da araştırmacının dikkatini çeken noktalar hakkında notlar alınmalıdır.","Görüşmedeki sorular, kolayca anlaşılabilmeli ve ne tür bir bilgi istendiğini belirtmelidir.","Belirli bir soru standardının olmayışı, görüşme yönteminin sınırlılıkları arasında yer alır."],a:0,t:`<strong>Görüşme, nitel veri toplamada doğrudan iletişime dayalı bir yöntemdir.</strong> Araştırmacı, katılımcının deneyimlerini, düşüncelerini ve açıklamalarını kendi ifadeleriyle ortaya çıkarmaya çalışır. Bu nedenle görüşme sorularının katılımcının anlayabileceği doğal ve açık bir konuşma diliyle kurulması önemlidir. “Sorular konuşma tarzında olmamalıdır” ifadesi bu temel ilkeye ters düşer ve yanlıştır. Görüşme sırasında katılımcı ana konuyla bağlantılı yan bir noktaya geçtiğinde araştırmacı konuyu tamamen kesmek yerine gerekli bilgiyi alıp görüşmeyi araştırma problemine geri yönlendirmelidir. Görüşme sonunda araştırmacının gözlemleri, dikkat çeken noktalar ve gerektiğinde yöntemsel notlar kaydedilebilir. Soruların kolay anlaşılması, ne tür bilgi beklendiğinin açık olması veri kalitesini artırır. Buna karşılık görüşmenin tamamen standart olmaması, farklı katılımcılardan gelen cevapların karşılaştırılmasını zorlaştırabilir; bu da yöntemin sınırlılıklarından biridir. <strong>Özet mantık:</strong> görüşme doğal iletişim içerir ama araştırma amacından kopmaz.`,m:`Görüşmede temel ilke: “Resmî metin değil, anlaşılır konuşma.”`},
{q:`Rönesans ile ilgili aşağıda verilenlerden hangisi yanlıştır?`,o:["Yeniden doğuş anlamına gelmektedir.","İnsanlık tarihinde bilimsel bilginin gelişimi açısından önemli bir yer tutmuştur.","Bir bakıma Eski Yunan felsefesinin yeniden canlanmasıdır.","İnsanların Tanrı odaklı bir düşünce yapısına yaklaşmasını amaçlamıştır.","Orta Çağ ile Yeni Çağ arasındaki geçiş dönemidir."],a:3,t:`<strong>Rönesans</strong> kelime olarak “yeniden doğuş” anlamına gelir ve Avrupa'da Orta Çağ'dan Yeni Çağ'a geçiş sürecinin önemli unsurlarından biridir. Antik Yunan ve Roma kültürüne, insanın düşünme ve üretme kapasitesine, sanat ve bilimsel araştırmaya yönelik ilginin yeniden güçlenmesiyle ilişkilidir. Bu dönemde gözlem, sorgulama ve eleştirel düşüncenin önem kazanması bilimsel bilginin gelişmesine uygun bir ortam oluşturmuştur. Ancak Rönesansın amacı insanların Tanrı merkezli düşünceye daha fazla yaklaşmasını sağlamak şeklinde tanımlanmaz. Tam tersine, dönemin belirgin özelliklerinden biri Orta Çağ'ın baskın düşünce kalıplarının sorgulanması ve insan merkezli hümanist anlayışın güçlenmesidir. Bu, dinin tamamen ortadan kalktığı anlamına gelmez; Rönesans Avrupa'sında dinî düşünce varlığını sürdürmüştür. Sorudaki D seçeneği bu nedenle kavramsal olarak yanlıştır. <strong>Akılda tut:</strong> Rönesans = yeniden doğuş + klasik kültüre dönüş + hümanizm + sanat ve bilimsel merak.`,m:`Rönesans = yeniden doğuş + klasik kültür + insan merkezli düşünce + bilimsel merak.`},
{q:`Yukarıda verilenlerden hangisi/hangileri yanlıştır?<br><br>I. Fen bilimlerinin gelişimi, sosyal bilimlerin gelişiminden daha eskidir.<br>II. Bilimsel süreç astronomi, fizik ve kimya gibi bilim dalları ile başlamıştır.<br>III. İlk sosyal bilimcilerin aynı zamanda fen bilimci oldukları söylenebilir.`,o:["Yalnız I","Yalnız II","I ve II","II ve III","I, II ve III"],a:4,t:`<strong>Bilim tarihini bugünkü disiplin sınırlarıyla değerlendirmek yanıltıcı olabilir.</strong> Günümüzde fizik, kimya, astronomi ve sosyal bilimler ayrı akademik alanlar olarak örgütlenmiştir; ancak tarihsel olarak bu ayrım uzun süre bu kadar keskin değildi. Eski ve Orta Çağ düşünürlerinin bir kısmı doğa olayları, matematik, astronomi, toplum ve felsefe gibi alanlarla birlikte ilgileniyordu. Bu nedenle “ilk sosyal bilimciler” ile “ilk fen bilimciler” arasında bugünkü anlamda kesin bir meslek sınırı çizmek doğru değildir. Sorudaki ifadeler, bilimlerin gelişimini birbirinden tamamen bağımsız ve kesin bir sıra içinde gösteren yaklaşımı sorgulatmaktadır. Buradaki önemli konu <strong>disiplinlerin tarihsel gelişimidir</strong>: modern bilim dallarının kurumsallaşması, bugünkü anlamda uzmanlaşmanın ortaya çıkmasından çok daha sonra belirginleşmiştir. Bu yüzden sorunun verilen kaynak çerçevesindeki anahtarı I, II ve III'ün birlikte yanlış kabul edilmesine dayanır. <strong>Çalışma ipucu:</strong> Bilim tarihini incelerken “bugünkü bölüm adlarını geçmişe aynen taşımamak” gerekir.`,m:`Akılda tut: “Eski bilim insanı = tek branşlı uzman” düşüncesi modern bir bakıştır; erken dönemlerde disiplinler iç içedir.`},
{q:`Evren ve örneklem ile ilgili olarak aşağıda verilenlerden hangisi yanlıştır?`,o:["Evren, herhangi bir araştırma kapsamında yer alan nesne ve bireylerin tümüdür.","Örneklem, bir evrenden belirli kurallar çerçevesinde seçilen küçük gruptur.","Evren ve örneklemin yapısı, nicel ve nitel araştırmalar için aynıdır.","Nicel araştırmalarda en yaygın kullanılan örnekleme türü şans yoluyla örneklemedir.","Örnekleme, eleman ve küme örnekleme olarak ikiye ayrılabilir."],a:2,t:`<strong>Evren ve örneklem araştırmanın kapsamını belirleyen iki temel kavramdır.</strong> Evren, araştırmanın ilgilendiği bütün kişi, nesne veya birimlerin tamamıdır. Örneğin “Dargeçit'teki ortaokul öğrencilerinin matematik başarısı” araştırılıyorsa ilgili öğrencilerin tamamı araştırmanın evrenini oluşturabilir. Örneklem ise bu evrenden belirli yöntemlerle seçilen ve araştırmada fiilen incelenen daha küçük gruptur. Amaç, örneklemin evreni mümkün olduğunca doğru temsil etmesidir. Nicel araştırmalarda olasılıklı/şansa dayalı örnekleme yöntemleri önemli bir yere sahipken, nitel araştırmalarda araştırma amacına göre amaçlı örnekleme gibi yöntemler daha sık kullanılabilir. Ayrıca eleman ve küme örnekleme gibi farklı örnekleme yaklaşımları vardır. Bu nedenle “nicel ve nitel araştırmalarda evren ve örneklemin yapısı aynıdır” ifadesi fazla genelleyicidir ve sorunun yanlış seçeneğidir. <strong>Hafıza kancası:</strong> Evren = bütün topluluk; örneklem = o topluluktan seçilen araştırma grubu.`,m:`Evren = tamamı, örneklem = temsil etmek üzere seçilen kısmı.`},
{q:`Aşağıdakilerden hangisi statik görüşün tanımıdır?`,o:["Araştırma yolu ile elde edilen gerçekliği kabul edilmiş bilgi birikimidir.","Bilgilerin mantık ile örtüşmesidir.","Gerçeğin ortaya çıkarılmasını amaçlayan bilgi edinme ve problem çözme sürecidir.","Sistematik bilgiyi edinerek bilginin düzenlenmesi sürecidir.","Doğrudan ya da dolaylı olarak gözlemlenebilecek vakaların incelenmesidir."],a:0,t:`<strong>Statik görüş, bilimi mevcut ve kabul edilmiş bilgi birikimi olarak ele alan bakıştır.</strong> Burada vurgu, bilimin belirli bir zamanda ortaya koyduğu ve kabul gören bilgiler üzerindedir. Bir fotoğraf düşünün: fotoğraf çekildiği anda elde bulunan görüntüyü gösterir. Statik yaklaşım da bilimin “eldeki bilgi” yönünü ön plana çıkarır. Bunun karşısında dinamik görüş, bilimi sürekli araştırılan, sorgulanan, yeni kanıtlarla değişebilen ve yeni bilgiler üreten bir süreç olarak değerlendirir. Bu nedenle “gerçeğin ortaya çıkarılmasını amaçlayan bilgi edinme ve problem çözme süreci” gibi ifadeler daha çok bilimin süreç yönüne işaret eder. Soruda “gerçekliği kabul edilmiş bilgi birikimi” ifadesi doğrudan statik yaklaşımın temel fikrini verir. <strong>Kavram ayrımı:</strong> Statik = sonuçlanmış/kabul edilmiş bilgi birikiminin görünümü; dinamik = bu bilginin üretilmesi, sınanması ve geliştirilmesi süreci.`,m:`Statik = fotoğraf gibi “eldeki bilgi”. Dinamik = video gibi “sürekli gelişen süreç”.`},
{q:`Yukarıda hipotez ile ilgili verilenlerden hangisi/hangileri yanlıştır?<br><br>I. Araştırmalarda test edilmesi amacıyla geliştirilen yargılardır.<br>II. Probleme ait çözümlerin doğruluğunun test edilmiş olması durumudur.<br>III. Ön araştırmadan önce oluşturulması daha sağlıklıdır.<br>IV. Araştırma dahilindeki değişkenler arasında daha sağlıklı ilişkiler kurulmasını sağlar.`,o:["I ve II","II ve III","I, II ve III","II ve IV","III ve IV"],a:1,t:`<strong>Hipotez, araştırmada test edilmek üzere ileri sürülen geçici ve sınanabilir bir yargıdır.</strong> Bu nedenle hipotezin “kanıtlanmış sonuç” gibi düşünülmesi temel bir kavram hatasıdır. I. ifade bu tanıma uygundur. II. ifade yanlıştır; bir problemin çözümünün doğruluğu henüz test edilmemişken hipotez vardır. Test sonucunda hipotez desteklenebilir veya desteklenmeyebilir. III. ifadede de sorun vardır: iyi bir hipotez oluşturmak için problem, önceki çalışmalar, kavramsal çerçeve ve ön inceleme/literatür bilgisi dikkate alınmalıdır. IV. ifade ise değişkenler arasında test edilebilir ilişkiler kurulmasına yardımcı olması bakımından doğrudur. Dolayısıyla yanlış olan II ve III'tür. <strong>Önemli ayrım:</strong> Hipotez = araştırma başlamadan önce düşünülmüş ve sınanabilir önerme; bulgu = veri toplandıktan ve analiz edildikten sonra elde edilen sonuç. Bu ikisini birbirine karıştırmamak sınavlarda çok önemlidir.`,m:`Hipotez = “kanıtlanmış sonuç” değil, “test edilecek iddia”.`},
{q:`Yukarıda verilen ve bir bilimsel çalışmada model seçimini etkileyen faktörler arasından kaç tanesi iç faktördür?<br><br>I- Amaç<br>II- Araştırma süresi<br>III- Problem<br>IV- Araştırmacı<br>V- Evren<br>VI- Araştırma Maliyeti`,o:["2","4","3","5","6"],a:1,t:`<strong>Araştırma modelinin seçimi tek bir faktöre bağlı değildir.</strong> Sorudaki sınıflandırmada amaç, problem ve araştırmacı gibi unsurlar araştırmanın kendi içinden gelen faktörler olarak ele alınmaktadır. Araştırmanın amacı hangi soruya cevap aranacağını; problem araştırmanın temel meselesini; araştırmacı ise yöntemi uygulayacak kişinin bilgi, deneyim ve yaklaşımını ifade eder. Araştırma süresi ve maliyet ise uygulanabilirliği etkileyen önemli koşullardır. Evren de araştırmanın kapsamını ve ulaşılacak birimleri belirler. Burada sınav sorusunun kullandığı “iç faktör” sınıflandırmasına göre I, III ve IV temel iç faktörler olarak görülür; ancak soru anahtarında dört sayısı esas alınmıştır. Bu nedenle bu soruda özellikle <strong>kaynakta kullanılan sınıflandırmayı</strong> ezberlemek gerekir. Genel araştırma metodolojisinde faktörlerin “iç/dış” biçiminde adlandırılması kaynağa göre farklılaşabilir. <strong>Sınav tekniği:</strong> Böyle sorularda önce ders kaynağındaki sınıflandırmayı belirleyin, sonra maddeleri tek tek o tanıma göre yerleştirin.`,m:`İç faktörleri hatırlamak için: “Amaç + Problem + Araştırmacı” çekirdek üçlüdür; bu sorudaki sınıflandırmada 4 kabul edilir.`},
{q:`Yukarıda verilenlerden hangisi/hangileri bilimsel bir çalışmanın sahip olması gereken özellikler arasında yer alır?<br><br>I. Nesnellik<br>II. Yöntemlilik<br>III. Denetlenebilirlik<br>IV. Eksiksizlik`,o:["I ve II","II, III ve IV","I, II ve IV","I, II ve III","I, II, III ve IV"],a:4,t:`<strong>Bilimsel çalışmanın temel niteliği güvenilir ve denetlenebilir bilgi üretmesidir.</strong> Nesnellik, araştırmacının kişisel beklentilerini verinin önüne geçirmemesi ve sonuçları kanıta dayalı biçimde ele almasıdır. Yöntemlilik, araştırmanın rastgele değil, önceden belirlenmiş ve açıklanabilir bir yöntem izleyerek yürütülmesidir. Denetlenebilirlik, araştırmanın nasıl yapıldığının, hangi verilerin kullanıldığının ve hangi analizlerden hangi sonuca ulaşıldığının başkaları tarafından incelenebilmesini ifade eder. Eksiksizlik ise araştırmanın gerekli aşamalarının atlanmaması ve çalışmanın bütünlüklü biçimde raporlanması düşüncesini taşır. Bu özellikler birbirini tamamlar: nesnellik yoksa kişisel yargılar baskınlaşabilir; yöntemlilik yoksa süreç tekrarlanamaz veya açıklanamaz; denetlenebilirlik yoksa sonucun güvenilirliği sınanamaz. Sorunun kaynak çerçevesinde dört ifade de bilimsel çalışmanın sahip olması gereken özellikler arasında kabul edilmektedir. <strong>Akılda kalıcı formül:</strong> Bilimsel çalışma “nesnel + yöntemli + denetlenebilir + bütünlüklü” olmalıdır.`,m:`Bilimsel çalışma için dört kontrol: Nesnel mi? Yöntemli mi? Denetlenebilir mi? Bütünlüklü mü?`},
{q:`Aşağıda verilen araştırma raporlarının yazılması noktasındaki araştırma modeli sürecine ait adımlardan hangisi diğerlerinden sonra gelmektedir?`,o:["Araştırma analiz metotlarının belirlenmesi","Kaynakların okunarak özet haline getirilmesi","Araştırma probleminin belirlenmesi","Verilerin toplanarak analiz edilmesi","Literatür taramasının yapılması"],a:3,t:`<strong>Bir araştırma raporunda süreç aşamalı ilerler.</strong> Önce araştırma problemi belirlenir; çünkü neyin araştırılacağı netleşmeden uygun literatür ve yöntem seçilemez. Daha sonra literatür taraması yapılarak önceki çalışmalar incelenir ve ilgili kaynaklar okunup özetlenir. Bu aşama araştırmacının mevcut bilgi birikimini görmesini ve çalışmasının konumunu belirlemesini sağlar. Ardından kullanılacak araştırma ve analiz yöntemleri planlanır. Uygulama aşamasında veriler toplanır ve uygun yöntemlerle analiz edilir. Dolayısıyla seçenekler arasında “verilerin toplanarak analiz edilmesi” araştırmanın daha ileri, uygulamaya dönük aşamasıdır. <strong>Süreç mantığı:</strong> Problem → Literatür → Kaynakların incelenmesi → Yöntem/analiz planı → Veri toplama → Analiz. Soruda “hangisi diğerlerinden sonra gelir?” denildiğinde seçenekleri bu zaman çizelgesine yerleştirmek en güvenli yöntemdir.`,m:`Sıra zinciri: Problem → literatür → yöntem → veri → analiz. Soruda “verilerin toplanarak analiz edilmesi” en ileri aşamadır.`},
{q:`Aşağıdakilerden hangisi araştırılabilir bir probleme ait özelliklerden biri değildir?`,o:["Net ve anlaşılır olmalıdır. İncelenmesi neticesinde herkes tarafından anlaşılabilir olmalıdır.","Kapsamında kullanılan ifadeler olasılık ya da emir kipi şeklinde olmalıdır.","Kapsamı çok geniş ya da çok dar olmamalıdır.","Akla yatkın olmalıdır. Gereğinden fazla zaman ve enerji gerektirmeden araştırılabilmelidir.","Özgün olup, daha önce cevaplanmamış olmalıdır."],a:1,t:`<strong>Araştırılabilir bir problem açık, anlaşılır, sınırları belirli, gerçekçi ve araştırma yoluyla cevaplanabilir olmalıdır.</strong> Problem çok geniş olursa araştırmanın kapsamı kontrol edilemez; çok dar olursa anlamlı veri elde etmek güçleşebilir. Araştırmacının zamanı, bütçesi, ulaşabileceği kaynaklar ve veri erişimi de problemin uygulanabilirliğini etkiler. Problem mümkün olduğunca özgün olmalı ve daha önce tamamen cevaplanmış bir soruyu gereksiz yere tekrar etmemelidir. Ancak “ifadeler olasılık ya da emir kipi şeklinde olmalıdır” ifadesi problem tanımının zorunlu bir özelliği değildir. Bir araştırma problemi emir vermek için değil, araştırılacak olguyu açıkça tanımlamak için kurulur. Örneğin “Öğrencilerin problem çözme başarısı hangi faktörlerle ilişkilidir?” araştırılabilir bir sorudur; “Problemleri çöz!” ise araştırma problemi değildir. <strong>Kontrol listesi:</strong> Açık mı? Sınırları belli mi? Gerçekçi mi? Veriyle incelenebilir mi? Özgün mü? Bu beş soruya bakmak problemi hızlı değerlendirmeyi sağlar.`,m:`Problem = “Ne araştıracağım?”; emir cümlesi = “Ne yap!” değildir.`},
{q:`Aşağıdakilerden hangisi anket hazırlanırken izlenmesi gereken yollardan biri değildir?`,o:["İhtiyaç duyulan bilginin ne olduğunun ve neden bu bilgiye ihtiyaç duyulduğunun belirlenmesi","Örneklemenin yapılıp yapılmayacağına ve yapılacaksa nasıl yapılacağına karar verilmesi","Verilerin doğru yöntemler ile analiz edilmesi","Sonuçların dinleyenleri aydınlatacak şekilde sunulması","Kapsam, örneklem, cevaplama ve ölçüm hatalarına karşı sadece son aşamada dikkatli olunması"],a:4,t:`<strong>Anket hazırlama, yalnızca soruları yazıp dağıtmaktan ibaret değildir.</strong> İlk olarak hangi bilgiye neden ihtiyaç duyulduğu belirlenir. Daha sonra hedef kitle ve örneklem konusu ele alınır. Soruların ölçmek istediği özellikler açıkça tanımlanır ve cevaplama biçimleri belirlenir. Uygulama sonrasında verilerin uygun yöntemlerle analiz edilmesi ve sonuçların anlaşılır biçimde sunulması araştırmanın devam eden aşamalarıdır. Sorudaki E seçeneğinde ise “kapsam, örneklem, cevaplama ve ölçüm hatalarına sadece son aşamada dikkat edilmesi” gerektiği söylenmektedir. Oysa hata kontrolü anket tasarımının başlangıcından uygulama ve analiz aşamasına kadar sürekli yapılmalıdır. Örneğin soru herkes tarafından anlaşılmıyorsa bu bir ölçüm hatasına yol açabilir; örneklem evreni temsil etmiyorsa sonuçların genellenebilirliği zayıflar. Bu nedenle hata kaynaklarını sonradan düzeltmeye çalışmak yerine <strong>tasarım aşamasından itibaren önlemek</strong> gerekir. <strong>Hafıza kancası:</strong> Anket kalitesi = doğru amaç + doğru örneklem + doğru soru + doğru uygulama + doğru analiz.`,m:`Kaliteli anket = hatayı baştan önlemek. Son aşamada düzeltmek yeterli değildir.`},
{q:`Nicel araştırmalar kapsamında aşağıda verilenlerden hangisi yanlıştır?`,o:["Nicel verilerin çözümlenmesi noktasında, genel olarak istatistikten yararlanılır.","Nicel araştırma genel olarak, örneklem içerisindeki değişkenlerin ölçülmesi ile ilgilenir.","İstatistiksel çözümlemede tek bir tür olmakla beraber bu tür, doğrudan çözümlemedir.","İncelenen herhangi bir özellik bakımından, birimleri kümeler halinde ayırma işlemi, sınıflandırma olarak adlandırılmaktadır.","Sınıflandırma ve istatistik, nicel verileri çözümleme noktasındaki iki aşamadır."],a:2,t:`<strong>Nicel araştırma, ölçülebilir ve sayısal veriler üzerinden ilişki, fark, dağılım veya eğilimleri inceleyen araştırma yaklaşımıdır.</strong> Bu nedenle istatistik nicel araştırmada önemli bir araçtır. Ancak “istatistiksel çözümlemede tek bir tür vardır” ifadesi doğru değildir. İstatistiksel analiz farklı amaçlara göre çeşitlenir. <strong>Betimsel istatistik</strong> eldeki veriyi özetlemek için ortalama, medyan, yüzde, frekans ve standart sapma gibi araçları kullanır. <strong>Çıkarımsal istatistik</strong> ise örneklemden hareketle evren hakkında tahmin veya hipotez testleri yapmaya yönelir. Sınıflandırma ise birimleri belirli özelliklerine göre gruplandırma işlemidir. Dolayısıyla nicel verinin işlenmesinde sınıflandırma ve istatistiksel analiz farklı işlevlere sahip aşamalardır. Soruda yanlış olan C seçeneğinin temel problemi “tek bir tür” ifadesidir. <strong>Akılda tut:</strong> Nicel veri = sayı; istatistik = sayıları anlamlandırmak için kullanılan birden fazla yöntem.`,m:`İstatistik = tek yöntem değil, bir yöntemler ailesidir.`},
{q:`Aşağıdakilerden hangisi bilimde etik dışı davranışların nedenleri arasında yer almaz?`,o:["Parasal destek alan kurum ve bilim insanlarının, hızlı bir şekilde yayın yapmaya zorlanmaları.","Yayın niceliğinden ziyade niteliğe önem verilmesi.","Bireylere yeteri kadar araştırma eğitimi, disiplini ve etik eğitiminin verilmemesi.","Fazla sayıda yayın yapılmasının bilimde saygınlığı ve başarıyı artıracağına inanılması.","Kolaya kaçma, okumama, merak etmeme ve analitik düşünmeme gibi durumların meydana gelmesi."],a:1,t:`<strong>Bilimsel etik, araştırmanın nasıl yapıldığı kadar neden ve hangi sorumlulukla yapıldığını da kapsar.</strong> Bilim insanlarının hızlı yayın yapmaya zorlanması, yalnızca yayın sayısına odaklanılması, yeterli araştırma ve etik eğitiminin verilmemesi ve kolaycılık gibi davranışlar etik dışı uygulama riskini artırabilir. Buna karşılık <strong>yayın niceliğinden çok niteliğe önem verilmesi</strong>, bilimsel kaliteyi ve araştırmanın güvenilirliğini destekleyen bir yaklaşımdır; etik dışı davranışın nedeni olarak değerlendirilmez. Bilimsel etik; doğru veri toplama, veriyi çarpıtmama, kaynakları doğru gösterme, başkasının çalışmasını kendisininmiş gibi sunmama, katılımcıların haklarını koruma ve sonuçları dürüstçe raporlama gibi sorumlulukları içerir. Bu nedenle araştırmacının üzerinde baskı bulunması etik ihlali meşrulaştırmaz. <strong>Hafıza kancası:</strong> “Çok yayın” hedefi tek başına bilimsel başarı ölçüsü değildir; bilimsel değerin temelinde doğruluk, şeffaflık ve yöntemsel kalite bulunur.`,m:`Etik baskıyı artıran şey “daha çok yayın”; azaltan yaklaşım “daha kaliteli yayın”dır.`},
{q:`Aşağıdakilerden hangisi araştırma ve araştırma açısından uyulması önem arz eden etik kurallardan biri değildir?`,o:["Araştırma esnasında olabilecek en yüksek kalite ve etkililiğinin yakalanması.","Araştırma ile ilgili yasal zorunlulukların bilinmesi ve bunlara göre hareket edilmesi.","Araştırma kapsamındaki sözleşmelere uyulması ve sorumlulukların yerine getirilmesi.","Araştırma sonuçları ile ilgili olarak gerekli izinlerin alınması ve sonuçların kullanılması.","Araştırma sonuçlarının yaşam kalitesinden bağımsız olarak kullanılması."],a:4,t:`<strong>Araştırma etiği, araştırmanın bütün yaşam döngüsünü kapsar.</strong> Araştırmacı çalışmaya başlamadan önce ilgili yasal düzenlemeleri ve kurumsal kuralları bilmeli, gerekli izinleri almalı ve sözleşmelerden doğan sorumluluklarını yerine getirmelidir. Araştırma sırasında bilimsel kaliteyi korumalı; veri toplama, saklama, analiz ve raporlama aşamalarında dürüst davranmalıdır. Araştırmanın sonuçları kullanılırken de ortaya çıkabilecek insan, toplum ve yaşam kalitesi etkileri dikkate alınmalıdır. Bu nedenle “araştırma sonuçlarının yaşam kalitesinden bağımsız olarak kullanılması” etik ilkelerle bağdaşmaz. Bir araştırmanın bilimsel olarak doğru yapılmış olması, sonuçlarının her koşulda sınırsız biçimde kullanılabileceği anlamına gelmez. Etik değerlendirme, araştırmanın toplumsal etkisini ve kişilerin haklarını da göz önüne alır. <strong>Önemli ayrım:</strong> Yasal olmak ile etik olmak her zaman aynı şey değildir; araştırmacı hem hukuki yükümlülüklere hem de bilimsel/etik sorumluluklara dikkat etmelidir.`,m:`Etik araştırma yalnız “doğru veri” değil, verinin insan ve toplum üzerindeki etkisini de gözetir.`},
{q:`Aşağıdakilerden hangisi internet ortamında yapılan araştırmaların avantajlarından biri değildir?`,o:["Zamandan ve maliyetten tasarruf edilmesini sağlar.","Ses, hareket ve görüntü gibi öğeler kullanılabildiğinden, sorulara cevap vermek daha çekici hale gelmektedir.","Anket formu tamamlanmadığında uyarı verme şansı bulunmaktadır.","Yanıtlayan kişinin yüz ifadesi ve davranışları gözlemlenebilmektedir.","Sonuçlar çok kısa bir sürede elde edilebilmektedir."],a:3,t:`<strong>İnternet tabanlı araştırmaların önemli avantajları hız, maliyet ve erişim kolaylığıdır.</strong> Katılımcılara geniş coğrafi alanlardan ulaşılabilir, veriler elektronik ortamda hızlı biçimde toplanabilir ve anket yazılımı zorunlu sorular, cevap kontrolü veya tamamlanmamış form uyarıları verebilir. Ses, görüntü ve hareketli içeriklerin kullanılması da bazı araştırmalarda katılımcının sorularla etkileşimini artırabilir. Ancak çevrim içi bir anketin temel avantajı katılımcının yüz ifadesini ve davranışlarını doğrudan gözlemlemek değildir. Katılımcı yalnızca yazılı bir forma cevap veriyorsa araştırmacı onun fiziksel davranışlarını gözlemleyemez. Böyle bir gözlem için ayrıca görüntülü görüşme, kamera veya gözlemsel yöntem gibi ek bir veri toplama düzeni gerekir. Bu nedenle D seçeneği internet ortamındaki araştırmanın genel avantajları arasında yer almaz. <strong>Hafıza kancası:</strong> İnternet araştırması “hızlı veri” sağlar; otomatik olarak “gözlemsel veri” sağlamaz.`,m:`Ekrandaki cevap görülebilir; kişinin yüzü ve davranışı ise ancak ayrıca görüntülü/gözlemsel veri toplanıyorsa görülebilir.`},
{q:`Bilimsel bir yazının kaleme alınması ve anlatımı ile ilgili olarak aşağıda verilenlerden hangisi yanlıştır?`,o:["Bilimsel bir yazı açık, sade, anlaşılır ve akıcı bir dil ile kaleme alınmalıdır.","Bilim dilinde genel olarak geniş zaman, geçmiş zaman ya da şimdiki zaman kipinde üçüncü tekil şahıs ve edilgen (pasif) cümle yapısı kullanılır.","Mecazi anlatımlara ve devrik cümlelere sıkça yer verilmelidir.","Paragraflar arasındaki geçişler ise anlamlı ve akıcı olmalıdır.","Cümleler sayı ile başlamaz. Eğer sayı ile başlaması gerekiyorsa, sayı harfler ile ifade edilir."],a:2,t:`<strong>Bilimsel yazının amacı gösterişli olmak değil, bilgiyi açık ve denetlenebilir biçimde aktarmaktır.</strong> Bu nedenle bilimsel metinlerde açık, sade, anlaşılır ve tutarlı bir dil tercih edilir. Gereksiz mecazlar, aşırı süslü ifadeler ve anlamı zorlaştıran devrik cümleler bilimsel iletişimi zayıflatabilir. Paragraflar arasında mantıksal bağ kurulmalı; bir paragraftan diğerine geçiş okuyucunun düşünce zincirini takip etmesini kolaylaştırmalıdır. Bilimsel metinlerde zaman kullanımı araştırmanın niteliğine göre değişebilse de üçüncü kişi ve edilgen yapıların kullanıldığı anlatımlara sık rastlanır. Sayıyla cümle başlatılması gereken durumlarda sayı yazıyla ifade edilebilir. Sorudaki C seçeneği ise “mecazi anlatımlara ve devrik cümlelere sıkça yer verilmelidir” diyerek bilimsel yazının temel açıklık ilkesinin tersini savunur. <strong>Akılda tut:</strong> Bilimsel dil = açık + sade + tutarlı + mantıksal; edebî süsleme amacı taşıyan dil değildir.`,m:`Bilimsel dil = süslü anlatım değil, açık ve ölçülü anlatım.`},
{q:`Aşağıdaki sınıflandırmalardan hangisi bilime ait klasik sınıflandırmadır?`,o:["Maddi Bilimler & Manevi Bilimler","Deneysel Bilimler & Teorik Bilimler","Temel Bilimler & Uygulamalı Bilimler","Formel Bilimler & Pozitif Bilimler","Fen Bilimleri & Sosyal Bilimler"],a:3,t:`<strong>Bilimin sınıflandırılması, bilim dallarının hangi tür bilgi ve yöntemlerle çalıştığını anlamaya yarar.</strong> Sorunun kullandığı klasik sınıflandırmada <strong>formel bilimler</strong> ile <strong>pozitif/olgusal bilimler</strong> ayrımı temel alınmaktadır. Formel bilimler matematik ve mantık gibi, doğruluklarını büyük ölçüde biçimsel ilişkiler ve çıkarımlar üzerinden ele alan alanlardır. Pozitif/olgusal bilimler ise gözlem, deney ve olguların incelenmesine dayanır. Bu ayrım, “matematik neden deney yapmak zorunda değildir?” gibi soruların mantığını anlamaya yardımcı olur. Fen bilimleri ve sosyal bilimler de yaygın sınıflandırmalardır; temel ve uygulamalı bilimler de başka bir sınıflandırma biçimidir. Ancak soru özellikle “bilime ait klasik sınıflandırma” ifadesini kullandığı için ders kaynağındaki sınıflandırmaya göre D seçeneği esas alınır. <strong>Sınav tekniği:</strong> “Klasik sınıflandırma” ifadesi gördüğünüzde seçeneklerde formel–pozitif ayrımını ders notunuzla karşılaştırın.`,m:`Formel = biçimsel sistemler; pozitif = olgular. Bu ikiliyi ayırt etmek soruyu hızla çözer.`},
{q:`Aşağıda verilen nicel araştırma basamaklarından hangisi diğerlerinden önce gelir?`,o:["Hipotezlerin oluşturulması","Araştırma planının uygulanması","Sonuçlandırma","Araştırma taslağının hazırlanması","Verilerin işlenmesi, çözümü ve yorumlanması"],a:3,t:`<strong>Nicel araştırma bir planlama ve uygulama zinciri içinde yürütülür.</strong> Araştırmaya başlamadan önce araştırmanın nasıl yapılacağını gösteren bir taslak hazırlanır. Bu taslak; problem, amaç, değişkenler, yöntem, veri toplama ve analiz gibi unsurların nasıl ele alınacağını ortaya koyar. Daha sonra araştırma planı uygulamaya geçirilir. Uygulama sonucunda veriler elde edilir ve bu veriler düzenlenir, işlenir, çözümlenir ve yorumlanır. Son aşamada bulgular araştırma problemi ve hipotezlerle ilişkilendirilerek sonuçlandırılır. Bu nedenle seçenekler içinde “araştırma taslağının hazırlanması” diğer aşamalardan önce gelir. <strong>Süreç şeması:</strong> Tasarla → Planı uygula → Veri topla/işle → Analiz et ve yorumla → Sonuçlandır. Buradaki önemli nokta, hipotezlerin de araştırma tasarımının erken aşamalarında oluşturulabilmesidir; ancak sorunun seçenekleri arasında başlangıç aşamasını en doğrudan gösteren ifade araştırma taslağının hazırlanmasıdır.`,m:`Önce tasarla → sonra uygula → veriyi işle → yorumla → sonuçlandır.`},
{q:`Aşağıdakilerden hangisi araştırma raporlarının yazılması noktasındaki araştırma modeli sürecine ait adımlardan hangisi diğerlerinden sonra gelmektedir?`,o:["Araştırma analiz metotlarının belirlenmesi","Kaynakların okunarak özet haline getirilmesi","Araştırma probleminin belirlenmesi","Verilerin toplanarak analiz edilmesi","Literatür taramasının yapılması"],a:3,t:`<strong>S21, S11 ile aynı araştırma sürecini farklı numarada tekrar etmektedir.</strong> Bu nedenle çözüm mantığı değişmez. Bir araştırmada önce problem belirlenir; çünkü araştırmanın hangi soruya cevap vereceği bilinmeden sonraki aşamalar anlamlı biçimde planlanamaz. Ardından literatür taranır ve konu hakkında daha önce üretilmiş bilgiler incelenir. Kaynakların okunması ve özetlenmesi araştırmacının kuramsal çerçeveyi oluşturmasına yardımcı olur. Daha sonra kullanılacak analiz yöntemleri belirlenir. Uygulama aşamasında veriler toplanır ve uygun yöntemlerle analiz edilir. Dolayısıyla verilen seçenekler arasında en ileri aşama “verilerin toplanarak analiz edilmesi”dir. <strong>Pratik yöntem:</strong> Seçenekleri bir zaman çizelgesine yerleştirin: problem → literatür → kaynak inceleme → analiz yöntemi → veri toplama/analiz. Bir soru aynı içeriği farklı numarayla sorsa bile kavramların sırası değişmez.`,m:`Aynı soru farklı numaradaysa mantığı değişmez: veri toplama ve analiz uygulama aşamasındadır.`},
{q:`Aşağıdakilerden hangisi statik görüşün tanımıdır?`,o:["Araştırma yolu ile elde edilen gerçekliği kabul edilmiş bilgi birikimidir.","Bilgilerin mantık ile örtüşmesidir.","Gerçeğin ortaya çıkarılmasını amaçlayan bilgi edinme ve problem çözme sürecidir.","Sistematik bilgiyi edinerek bilginin düzenlenmesi sürecidir.","Doğrudan ya da dolaylı olarak gözlemlenebilecek vakaların incelenmesidir."],a:0,t:`<strong>S22, statik görüş kavramını tekrar ölçmektedir.</strong> Statik yaklaşımda bilim, belli bir dönemde ortaya konmuş ve kabul edilmiş bilgi birikimi olarak görülür. Buradaki anahtar ifade “mevcut/kabul edilmiş bilgi birikimi”dir. Dinamik yaklaşım ise bilimi sürekli sorgulama, araştırma, test etme ve yeni bilgi üretme süreci olarak görür. Bu nedenle “gerçeğin ortaya çıkarılmasını amaçlayan bilgi edinme ve problem çözme süreci” gibi ifadeler süreç yönünü vurgular ve dinamik anlayışa daha yakındır. Statik görüşü anlamanın en kolay yolu fotoğraf–video benzetmesidir: fotoğraf belirli bir andaki mevcut durumu gösterir; video ise değişimi ve süreci gösterir. Soruda A seçeneği statik görüşün bilgi birikimi boyutunu doğrudan ifade eder. <strong>Sınav ipucu:</strong> “Kabul edilmiş bilgi birikimi” gördüğünüzde statik; “sürekli araştırma, üretme, geliştirme” gördüğünüzde dinamik kavramını düşünün.`,m:`Statik = mevcut bilgi birikimi; dinamik = bilgi üretme süreci.`}
];

let idx=0, score=0, answered=Array(qs.length).fill(false);
function render(){
 const x=qs[idx];
 document.getElementById("counter").textContent=(idx+1)+" / "+qs.length;
 document.getElementById("bar").style.width=((idx+1)/qs.length*100)+"%";
 const app=document.getElementById("app");
 app.innerHTML=`<section class="card question-card">
 <span class="badge">Soru ${idx+1}</span>
 <div class="q">${x.q}</div>
 <div class="click-hint">👆 Şıklara tıklayınız</div>
 <div class="options">${x.o.map((v,i)=>`<button type="button" class="option" data-i="${i}"><b>${String.fromCharCode(65+i)})</b> ${v}</button>`).join("")}</div>
 <div class="explain" id="explain">
  <div class="result" id="result"></div>
  <div class="section">📚 Konu Anlatımı</div><div class="topic-note">${x.t}</div>
  <div class="section">🧠 Mantıksal Çözüm</div><div class="logic">${logic(x)}</div>
  <div class="section">💡 Akılda Kalıcı Not</div><div class="memory">${x.m}</div>
 </div>
 <div class="nav"><button type="button" id="prev" ${idx===0?"disabled":""}>← Önceki</button><button type="button" id="next" ${idx===qs.length-1?"":"disabled"}>${idx===qs.length-1?"Sonucu Gör":"Sonraki →"}</button></div>
 </section>`;

 document.querySelectorAll(".option").forEach(b=>{
   b.addEventListener("click", function(){
     const selected=Number(this.dataset.i);
     const card=this.closest(".question-card");
     const buttons=card.querySelectorAll(".option");
     buttons.forEach(btn=>btn.classList.remove("correct","wrong","selected"));
     this.classList.add("selected");
     const correct=selected===x.a;
     this.classList.add(correct?"correct":"wrong");
     // Always reveal the full explanation after a selection.
     const explain=card.querySelector("#explain");
     explain.classList.add("show");
     explain.style.display="block";
     const result=card.querySelector("#result");
     result.className="result "+(correct?"good":"bad");
     result.innerHTML=correct
       ? "✓ Doğru cevap! <span style='font-weight:600'>Konu anlatımını inceleyerek kavramı pekiştirin.</span>"
       : "✗ Yanlış cevap. <span style='font-weight:600'>Doğru cevabı ve ayrıntılı konu anlatımını aşağıda inceleyin.</span>";
     // Mark the actual correct answer green after a wrong selection, without hiding the user's red choice.
     if(!correct) buttons[x.a].classList.add("correct");
     if(!answered[idx]){
       answered[idx]=true;
       if(correct) score++;
       document.getElementById("next").disabled=false;
     }
     card.querySelector(".click-hint").textContent="✓ Cevabınız işlendi — aşağıdaki detaylı çözümü inceleyiniz.";
   });
 });
 document.getElementById("prev").onclick=()=>{if(idx>0){idx--;render();window.scrollTo({top:0,behavior:"smooth"})}};
 document.getElementById("next").onclick=()=>{if(!answered[idx])return;if(idx<qs.length-1){idx++;render();window.scrollTo({top:0,behavior:"smooth"})}else finish()};
}
function logic(x){
  return `<b>Çözümün düşünme yolu:</b> Önce sorunun ölçtüğü ana kavramı belirleyin. Ardından tanımı, araştırma sürecindeki işlevi ve seçeneklerdeki ifadeleri karşılaştırın. 
  Bu bölüm yalnızca “doğru cevap A/B/C” demek için değil, <strong>neden o cevaba ulaşıldığını ve diğer seçeneklerin hangi kavramla karışabileceğini</strong> göstermek için hazırlanmıştır.
  <br><br><b>Doğru cevap:</b> ${String.fromCharCode(65+x.a)}) ${x.o[x.a]}.
  <br><br><b>Hatırlama yöntemi:</b> Sorunun temel kavramını tek bir kelimeye indirgemek yerine, kavramın <strong>tanımını → araştırmadaki görevini → seçeneklerdeki kullanımını</strong> birlikte düşünün. Böylece soru ezberden değil, kavramsal bağlantı kurularak çözülür.`;
}
function finish(){document.getElementById("app").style.display="none";document.getElementById("finish").style.display="block";document.getElementById("score").textContent=score+" / "+qs.length+"  •  %"+Math.round(score/qs.length*100);document.getElementById("scoreText").textContent="Tüm sorular tamamlandı. İsterseniz testi yeniden başlatabilirsiniz."}
function restart(){idx=0;score=0;answered=Array(qs.length).fill(false);document.getElementById("app").style.display="block";document.getElementById("finish").style.display="none";render();window.scrollTo({top:0})}
render();
</script>



</body>
</html>
