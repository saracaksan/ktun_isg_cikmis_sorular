<script>
const DATA={"A": [{"id": "S1", "question": "Maden işyerlerinde İş Sağlığı ve Güvenliği Yönetmeliği'ne göre, Yer altı ocaklarında dinamit ile patlatma yapmadan önce hangi ölçüm yapılmalıdır?", "options": {"A": "Oksijen", "B": "Metan", "C": "Hava hızı", "D": "Karbondioksit", "E": "Karbonmonoksit"}, "answer": "B", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Soruda önce tanım ve sınıflandırma istenen kavramı belirleyin. Ardından seçenekleri aynı kavram düzleminde karşılaştırın; günlük dilde doğru görünen fakat mevzuat veya teknik terminolojiyle çelişen seçenekleri eleyin.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> ÖNCE KAVRAMI TANIMLA → SONRA SEÇENEKLERİ EŞLEŞTİR.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Oksijen</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Metan</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>C) Hava hızı</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Karbondioksit</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>E) Karbonmonoksit</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>B) Metan</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>B) Metan</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S2", "question": "Elektrik yangınlarında aşağıdaki söndürücü maddelerden hangisi kullanılmaz?", "options": {"A": "Halokarbon", "B": "Kuru Kimyevi Toz (KKT)", "C": "Karbondioksit", "D": "Su", "E": "Hiçbiri"}, "answer": "D", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Elektrik enerjisi bulunan ekipmanlarda söndürücü seçerken ikincil tehlike oluşturup oluşturmadığına bakılır. Su iletkenliği nedeniyle enerjili elektrik ekipmanlarında uygun bir seçim değildir; enerji mümkünse kesilir ve uygun söndürücü kullanılır.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> ELEKTRİK + ENERJİ VAR = SUYU OTOMATİK OLARAK SEÇME.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Halokarbon</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Kuru Kimyevi Toz (KKT)</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Karbondioksit</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Su</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>E) Hiçbiri</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>D) Su</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>D) Su</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S3", "question": "İşyerinin tamamında veya bir kısmında meydana gelebilecek yangın, patlama, tehlikeli kimyasal maddelerden kaynaklanan yayılım, doğal afet gibi acil müdahale, mücadele, ilkyardım veya tahliye gerektiren olaylara ne denir?", "options": {"A": "Güvensiz durum", "B": "Acil durum", "C": "Tehlike", "D": "Risk", "E": "Kaza"}, "answer": "B", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Soruda önce tanım ve sınıflandırma istenen kavramı belirleyin. Ardından seçenekleri aynı kavram düzleminde karşılaştırın; günlük dilde doğru görünen fakat mevzuat veya teknik terminolojiyle çelişen seçenekleri eleyin.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> ÖNCE KAVRAMI TANIMLA → SONRA SEÇENEKLERİ EŞLEŞTİR.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Güvensiz durum</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Acil durum</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>C) Tehlike</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Risk</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>E) Kaza</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>B) Acil durum</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>B) Acil durum</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S4", "question": "Binaların yangından korunması hakkındaki yönetmeliğe göre, bir binada yılda en az kaç kez yangın söndürme tatbikatı yapılmalıdır?", "options": {"A": "5", "B": "4", "C": "3", "D": "2", "E": "1"}, "answer": "E", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Tatbikatın amacı yalnızca 'yapılmış olmak' değildir; planın uygulanabilirliğini test etmek, aksaklıkları görmek ve düzeltici/önleyici faaliyetleri belirlemektir. İşyerlerinde acil durum tatbikatı en geç yılda bir yapılır; maden işyerlerinde ayrıca ilgili maden mevzuatı dikkate alınır.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> TATBİKAT = PLANIN PROVASI + EKSİKLERİN TESPİTİ.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) 5</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) 4</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) 3</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) 2</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>E) 1</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>E) 1</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>E) 1</b> — Doğru cevap.</p>\n <div class='warning'>Not: Kaynakta farklı işaretlenmiş olsa bile güncel mevzuat kontrolünde doğru seçenek E&#x27;dir.</div>\n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S5", "question": "İşyerlerinde Acil Durumlar Hakkında Yönetmelik'e göre, işyerlerindeki Acil Durumlar Hakkındaki Yönetmeliğe göre aşağıdakilerden hangisi acil durum olarak değerlendirilmelidir?", "options": {"A": "Doğal afetler", "B": "Nükleer maddelerden kaynaklanan yayılım", "C": "Yangın", "D": "Patlama", "E": "Hepsi"}, "answer": "E", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Acil durum; müdahale, mücadele, ilk yardım veya tahliye gerektiren olayları kapsar. İşveren, işyerinin koşullarını ve risklerini dikkate alarak muhtemel acil durumları belirler ve buna göre planlama yapar.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> ACİL DURUM = ÖNCEDEN BELİRLE + PLANLA + TATBİK ET.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Doğal afetler</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Nükleer maddelerden kaynaklanan yayılım</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Yangın</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Patlama</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>E) Hepsi</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>E) Hepsi</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>E) Hepsi</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S6", "question": "Aşağıdaki maddelerden hangisinin yanması B sınıfı (sıvı) yangın kapsamına girer?", "options": {"A": "Kömür", "B": "Metan", "C": "Aliminyum", "D": "Benzin", " , "C": "Boya", "D": "Plastik", "E": "Bütan"}, "answer": "E", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>C sınıfı yangınlar yanıcı gazlarla ilişkilendirilir. Bütan gibi gazlar bu sınıfa girer. Tiner ve boya ise gaz değildir.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> C = COMBUSTIBLE GAS → YANICI GAZ.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Kömür</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Tiner</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Boya</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Plastik</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>E) Bütan</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>E) Bütan</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>E) Bütan</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S11", "question": "Maden işyerlerinde iş sağlığı ve güvenliği Yönetmeliği'ne göre metan hava karışımına ne denir?", "options": {"A": "Grizu", "B": "Tahkimat", "C": "Varagel", "D": "Ferdi oksijenli kurtarıcı", "E": "Baraj"}, "answer": "A", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Yeraltı madenlerinde metan (CH₄), yanıcı/patlayıcı atmosfer oluşumu açısınd  seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Aliminyum</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Benzin</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>E) Azot</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>D) Benzin</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>D) Benzin</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S19", "question": "Yangın ile ilgili aşağıdaki cümlelerden hangisi yanlıştır?", "options": {"A": "Yanma nükleer bir olaydır", "B": "Yangın esnasında normal asansörler kullanılmaz", "C": "Katı madde yangınlarında su kullanılır", "D": "Sıvı madde yangınlarında köpük kullanılır", "E": "Söndürme esnasında rüzgar arkaya alınır"}, "answer": "D", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Yangın sorularında önce cümlenin fiziksel olarak doğru olup olmadığı kontrol edilir. Yanma kimyasal bir oksidasyon sürecidir; nükleer olay değildir. Katı yangınlarda su bazı durumlarda kullanılabilir, sıvı yangınlarda köpük uygun olabilir.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> YANMA = KİMYASAL OLAY; NÜKLEER DEĞİL.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Yanma nükleer bir olaydır</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Yangın esnasında normal asansörler kullanılmaz</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Katı madde yangınlarında su kullanılır</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Sıvı madde yangınlarında köpük kullanılır</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>E) Söndürme esnasında rüzgar arkaya alınır</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>D) Sıvı madde yangınlarında köpük kullanılır</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>D) Sıvı madde yangınlarında köpük kullanılır</b> — Doğru cevap.</p>\n \n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}, {"id": "S20", "question": "Elektrik yangınlarında aşağıdaki söndürücü maddelerden hangisi kullanılmaz?", "options": {"A": "Halokarbon", "B": "Kuru Kimyevi Toz (KKT)", "C": "Karbondioksit", "D": "Su", "E": "Hiçbiri"}, "answer": "D", "detail": "\n<div class=\"lesson\">\n <div class=\"lesson-title\">📚 KONUYU TAM KAVRA — Profesyonel Konu Anlatımı</div>\n <p>Elektrik enerjisi bulunan ekipmanlarda söndürücü seçerken ikincil tehlike oluşturup oluşturmadığına bakılır. Su iletkenliği nedeniyle enerjili elektrik ekipmanlarında uygun bir seçim değildir; enerji mümkünse kesilir ve uygun söndürücü kullanılır.</p>\n <div class=\"memory\"><b>🧠 AKILDA KALSIN:</b> ELEKTRİK + ENERJİ VAR = SUYU OTOMATİK OLARAK SEÇME.</div>\n <h4>🔎 Seçenekleri Tek Tek İnceleyelim</h4>\n <ul class=\"evaluations\"><li><b>A) Halokarbon</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>B) Kuru Kimyevi Toz (KKT)</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>C) Karbondioksit</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li><li><b>D) Su</b> — <span class='oktxt'>Doğru.</span> Soru köküyle teknik/mevzuat bağlantısı kurulabildiği için doğru seçenek budur.</li><li><b>E) Hiçbiri</b> — Yanlış. Bu seçenek sorunun aradığı kavramla eşleşmez.</li></ul>\n <h4>🎯 Sınav Mantığı</h4>\n <p>Bu tip soruda en hızlı yöntem, önce soru kökündeki ana kelimeyi yakalamaktır: ölçüm, sınıf, acil durum, tahliye, gaz, tatbikat veya tahkimat. Sonra seçenekleri bu ana kavramla eşleştirin. Doğru seçenek <b>D) Su</b>'dir.</p>\n <h4>📌 Sonuç</h4>\n <p><b>D) Su</b> — Doğru cevap.</p>\n <div class='warning'>Not: Kaynakta işaretlenen cevap ayrıca kontrol edilmiştir; mevzuat ve teknik sınıflandırmaya göre burada farklı cevap bulunmaktadır.</div>\n</div>\n<div class=\"legal\"><b>Mevzuat / kaynak kontrolü:</b> Bu açıklamalar sorunun konusu için Maden İşyerlerinde İSG Yönetmeliği, Binaların Yangından Korunması Hakkında Yönetmelik ve İşyerlerinde Acil Durumlar Hakkında Yönetmelik hükümleriyle uyumlu olacak şekilde hazırlanmıştır.</div>\n"}]};
let group="A",i=0,locked=false,right=0,answered=0;
const $=id=>document.getElementById(id);

function startExam(g){
 group=g;i=0;locked=false;right=0;answered=0;
 $("home").style.display="none";$("exam").style.display="block";
 document.querySelectorAll(".group").forEach(x=>x.classList.remove("active"));
 document.getElementById("g"+g).classList.add("active");
 render();scrollTo(0,0);
}
function render(){
 locked=false;
 locked=false;
 const qs=DATA[group],q=qs[i];
 $("examName").textContent="2025-2026 GÜZ FİNAL — "+group+" GRUBU";
 $("count").textContent="Soru "+(i+1)+" / "+qs.length;
 $("bar").style.width=(((i+1)/qs.length)*100)+"%";
 $("question").textContent=q.id+" — "+q.question;
 const box=$("options");box.innerHTML="";
 Object.entries(q.options).forEach(([l,t])=>{
   const b=document.createElement("button");b.className="option";
   b.dataset.letter=l;
   b.innerHTML="<b>"+l+")</b> "+esc(t);
   box.appendChild(b);
 });
 $("result").innerHTML="";$("solution").className="solution";$("solution").innerHTML="";
 $("prev").disabled=i===0;$("next").disabled=true;$("next").textContent=i===qs.length-1?"Bitir →":"Sonraki →";
}
function answer(sel,clicked){
 if(locked)return;
 locked=true;
 answered++;

 const q=DATA[group][i];
 const ok=sel===q.answer;
 if(ok)right++;

 document.querySelectorAll("#options .option").forEach(b=>{
   b.disabled=true;
   const l=b.dataset.letter;
   if(l===q.answer)b.classList.add("correct");
 });

 if(!ok && clicked) clicked.classList.add("wrong");

 $("result").innerHTML =
   '<div class="result '+(ok?"good":"bad")+'">'+
   (ok?"✓ DOĞRU":"✕ YANLIŞ — Doğru cevap: "+q.answer)+
   '</div>';

 $("solution").className="solution show";
 $("solution").innerHTML=q.detail;
 $("next").disabled=false; $("next").focus({preventScroll:true});
}

function nextQ(){
 if(i<DATA[group].length-1){i++;render();scrollTo({top:0,behavior:"smooth"});}
 else{
   $("bar").style.width="100%";$("question").innerHTML="<h2>Sınav tamamlandı</h2><p>Doğru: <b>"+right+"</b> · Cevaplanan: <b>"+answered+"</b> · Başarı: <b>"+(answered?Math.round(right/answered*100):0)+"%</b></p>";
   $("options").innerHTML="";$("result").innerHTML="";$("solution").className="solution";$("next").disabled=true;
 }
}
function prevQ(){if(i>0){i--;render();scrollTo({top:0,behavior:"smooth"});}}

document.addEventListener("click",function(e){
 const btn=e.target.closest("#options .option");
 if(!btn || btn.disabled || locked)return;
 answer(btn.dataset.letter,btn);
});

function esc(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");}
</script>
