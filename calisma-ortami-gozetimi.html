<style>
*{box-sizing:border-box}
:root{
 --navy:#102d4f;--blue:#1769aa;--bg:#f4f7fb;--white:#fff;
 --text:#172033;--muted:#667085;--line:#dfe6ee;
 --green:#15803d;--green-bg:#ecfdf3;--green-line:#55b87a;
 --red:#c62828;--red-bg:#fff1f1;--red-line:#e87878;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}
.header{background:linear-gradient(135deg,#0c2948,#1769aa);color:#fff;padding:22px 16px}
.header-inner{max-width:980px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:18px}
.brand-block{min-width:0}
.top-nav{display:flex;align-items:center;gap:7px;flex-wrap:wrap;justify-content:flex-end}
.nav-link{display:inline-flex;align-items:center;justify-content:center;text-decoration:none;
 color:#fff;background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.28);
 border-radius:9px;padding:9px 13px;font-size:13px;font-weight:750;cursor:pointer;
 transition:.18s}
.nav-link:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
.home-link{background:rgba(255,255,255,.18)}
@media(max-width:650px){
 .header-inner{flex-direction:column;align-items:stretch}
 .top-nav{justify-content:flex-start}
 .nav-link{flex:1}
}

.title{font-size:25px;font-weight:800}.subtitle{opacity:.82;margin-top:5px;font-size:13px}
.main{max-width:980px;margin:auto;padding:24px 14px 50px}
.panel{background:#fff;border:1px solid var(--line);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(16,45,79,.07)}
h1{font-size:30px;margin:0 0 8px}.desc{color:var(--muted);line-height:1.65}
.tabs{display:flex;gap:10px;margin:22px 0 18px}
.tab{flex:1;border:1px solid var(--line);background:#f8fafc;padding:13px;border-radius:11px;
 font-weight:800;cursor:pointer;color:var(--navy)}
.tab.active{background:var(--navy);color:#fff}
.progress{height:8px;background:#e8edf3;border-radius:99px;overflow:hidden;margin:17px 0}
.progress>div{height:100%;background:#1769aa;width:0}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:700}
.question{font-size:20px;line-height:1.6;font-weight:750;margin:22px 0}
.options{display:grid;gap:10px}
.option{border:1px solid #d4dde7;background:#fff;border-radius:12px;padding:15px;text-align:left;
 cursor:pointer;font-size:15px;line-height:1.5}
.option:hover:not(:disabled){background:#f5f9fd;border-color:#75a2c9}
.option:disabled{cursor:default}
.option.correct{background:var(--green-bg)!important;border-color:var(--green-line)!important;color:#11632f}
.option.wrong{background:var(--red-bg)!important;border-color:var(--red-line)!important;color:#9d2020}
.result{margin-top:17px;padding:13px 15px;border-radius:11px;font-weight:800}
.result.good{background:var(--green-bg);color:var(--green);border:1px solid var(--green-line)}
.result.bad{background:var(--red-bg);color:var(--red);border:1px solid var(--red-line)}
.solution{display:none;margin-top:16px;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.solution.show{display:block}
.solution-head{padding:14px 16px;background:#f7f9fb;font-weight:850;color:var(--navy)}
.solution-body{padding:17px;line-height:1.75;color:#344054}
.controls{display:flex;justify-content:space-between;margin-top:20px;gap:10px}
.btn{border:0;border-radius:10px;padding:12px 17px;background:var(--navy);color:#fff;font-weight:800;cursor:pointer}
.btn.secondary{background:#eaf0f5;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:not-allowed}
#app{display:none}
.footer{text-align:center;color:#7b8794;font-size:12px;padding:22px}
@media(max-width:650px){
 h1{font-size:25px}.question{font-size:18px}.tabs{flex-direction:column}
 .panel{padding:18px}.controls .btn{flex:1}
}
</style>
</head>

ramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 4, "question": "İnsan kulağında ağrıya sebep olacak gürültü düzeyi kaç dB'dir?", "options": {"A": "110", "B": "140", "C": "160", "D": "180", "E": "85"}, "answer": "B", "answerText": "140", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>Gürültü</strong><span>İstenmeyen veya rahatsız edici ses; iş sağlığı açısından özellikle işitme ve iletişim üzerinde risk oluşturabilir.</span></div><div class=\"concept\"><strong>Desibel (dB)</strong><span>Ses/gürültü düzeyinin ifade edilmesinde kullanılan logaritmik ölçektir.</span></div><div class=\"concept\"><strong>Fiziksel risk etmeni</strong><span>Gürültü, titreşim, radyasyon, aydınlatma ve termal koşullar gibi fiziksel çevre etkenlerini kapsar.</span></div></div></div><div class=\"solution-section\"><div class=\"section-label\">ADIM ADIM PROFESYONEL ÇÖZÜM</div><p><b>1. Sorunun odağı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">B — 140</span></p><p><b>3. Gerekçe:</b> İnsan kulağının işitme ağrı eşiği genel kabul olarak 140 dB düzeyidir.</p><p><b>4. Sınav tekniği:</b> Seçeneklerde aynı kategoriye ait olmayan kavramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 5, "question": "Doku, salgı, dışkı, solunan hava ya da bunların kombinasyonundaki madde ya da metabolitlerde görülen ve birtakım hastalıklara neden olan maruziyet ve etkenler hangi gruba girerler?", "options": {"A": "Kimyasal etkenler", "B": "Biyolojik etkenler", "C": "Psikolojik etkenler", "D": "Fiziksel etkenler", "E": "Radyoaktif etkenler"}, "answer": "B", "answerText": "Biyolojik etkenler", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>Biyolojik etken</strong><span>İnsanlarda enfeksiyon, alerji veya zehirlenmeye yol açabilen mikroorganizma ve biyolojik kaynaklı etkenlerdir.</span></div><div class=\"concept\"><strong>Mikroorganizma</strong><span>Bakteri, virüs, mantar gibi mikroskobik canlı veya biyolojik ajanları kapsayan genel terimdir.</span></div><div class=\"concept\"><strong>Biyolojik risk</strong><span>Çalışanın biyolojik etkenlere maruz kalması sonucunda ortaya çıkabilecek sağlık riskidir.</span></div></div></div><div class=\"solution-section\"><div class=\"section-label\">ADIM ADIM PROFESYONEL ÇÖZÜM</div><p><b>1. Sorunun odağı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">B — Biyolojik etkenler</span></p><p><b>3. Gerekçe:</b> Canlı organizmalar, vücut sıvıları, salgılar ve biyolojik kaynaklı enfeksiyon ajanları biyolojik etkenler sınıfına girer.</p><p><b>4. Sınav tekniği:</b> Seçeneklerde aynı kategoriye ait olmayan kavramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 6, "question": "Aşağıdakilerden hangisi kömür tozunun solunması sonucu oluşan akciğer hastalığıdır?", "options": {"A": "Antrakozis", "B": "Siderozis", "C": "Asbestozis", "D": "Bisinozis", "E": "Talkozis"}, "answer": "A", "answerText": "Antrakozis", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>Toz</strong><span>İşlem sırasında oluşabilen, havada asılı kalabilen katı parçacıklardır.</span></div><div class=\"concept\"><strong>İnert toz</strong><span>Akciğerlere ulaşabilmesine rağmen verilen kaynak tanımında yapısa ection-label\">ADIM ADIM PROFESYONEL ÇÖZÜM</div><p><b>1. Sorunun odağı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">E — Tozun özgül ağırlığı</span></p><p><b>3. Gerekçe:</b> Yönetmelik uyarınca risk değerlendirmesinde tozun çeşidi, maruziyet süresi/düzeyi, ölçüm sonuçları ve sağlık kayıtları esastır; tozun özgül ağırlığı değerlendirme kriteri değildir.</p><p><b>4. Sınav tekniği:</b> Seçeneklerde aynı kategoriye ait olmayan kavramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 13, "question": "Aşağıdaki birimlerden hangisi fiziksel risk etmenlerinden biri değildir?", "options": {"A": "Aydınlatma", "B": "Gürültü", "C": "Stres", "D": "Titreşim", "E": "Sıcaklık"}, "answer": "C", "answerText": "Stres", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>Gürültü</strong><span>İstenmeyen veya rahatsız edici ses; iş sağlığı açısından özellikle işitme ve iletişim üzerinde risk oluşturabilir.</span></div><div class=\"concept\"><strong>Desibel (dB)</strong><span>Ses/gürültü düzeyinin ifade edilmesinde kullanılan logaritmik ölçektir.</span></div><div class=\"concept\"><strong>Fiziksel risk etmeni</strong><span>Gürültü, titreşim, radyasyon, aydınlatma ve termal koşullar gibi fiziksel çevre etkenlerini kapsar.</span></div><div class=\"concept\"><strong>Titreşim</strong><span>Mekanik titreşimlerin çalışan üzerindeki maruziyetini ifade eder.</span></div><div class=\"concept\"><strong>El-kol titreşimi</strong><span>Özellikle el ve kollara aktarılan titreşim maruziyetidir.</span></div><div class=\"concept\"><strong>Vücut titreşimi</strong><span>Titreşimin tüm vücuda, örneğin oturulan veya ayakta durulan yüzeyler üzerinden aktarılmasıdır.</spa im, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">C — I-II-III</span></p><p><b>3. Gerekçe:</b> Kimyasal ortamda yemek/sigara içmek, el/ağız yoluyla vücuda bulaşmaya (I), kimyasalın sindirim kanalıyla zehirlemesine (II) ve sigara ateşiyle parlayıcı ortamların patlamasına/yanmasına (III) yol açar.</p><p><b>4. Sınav tekniği:</b> Seçeneklerde aynı kategoriye ait olmayan kavramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 15, "question": "İnsanların yaşadığı veya çalıştığı ortamlarının daha rahat hale getirilmesi için atmosferik koşulları ısıtma veya soğutma gibi işlemlere tabi tutan yapay yollara ve teknolojik yöntemlerin tümüne verilen ad nedir?", "options": {"A": "Termal rahatlık", "B": "Kompresör", "C": "Havalandırma", "D": "Enfiltrasyon", "E": "İklimlendirme"}, "answer": "E", "answerText": "İklimlendirme", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>İklimlendirme</strong><span>Bir ortamın sıcaklık, nem, hava hareketi ve benzeri atmosferik koşullarının teknolojik sistemlerle düzenlenmesidir.</span></div><div class=\"concept\"><strong>Havalandırma</strong><span>Temiz hava sağlama ve kirleticileri ortamdan uzaklaştırma amacıyla hava değişimi yapılmasıdır.</span></div><div class=\"concept\"><strong>Termal rahatlık</strong><span>Çalışanın ortamın ısıl koşullarını uygun ve rahat algıladığı durumdur.</span></div></div></div><div class=\"solution-section\"><div class=\"section-label\">ADIM ADIM PROFESYONEL ÇÖZÜM</div><p><b>1. Sorunun odağı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">E — İklimlendirme</span></p><p><b>3. Gerekçe:</b> Isıtma, soğutma, n ğı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">D — Silikozis</span></p><p><b>3. Gerekçe:</b> Şarbon, Bruselloz, Tüberküloz ve Covid-19 mikroorganizmaların neden olduğu bulaşıcı/biyolojik hastalıklardır. Silikozis ise silis tozlarının solunmasıyla oluşan, kişiden kişiye bulaşmayan inorganik toz hastalığıdır.</p><p><b>4. Sınav tekniği:</b> Seçeneklerde aynı kategoriye ait olmayan kavramı belirlemek için önce soru kökünün istediği sınıfı/ölçümü/değeri belirleyin; ardından seçenekleri bu ölçüte göre eleyin.</p></div>"}, {"id": 18, "question": "Biyolojik Etkenlere Maruziyet Risklerinin Önlenmesi Hakkında Yönetmeliğe göre biyolojik etkenler kaç grupta sınıflandırılmıştır?", "options": {"A": "3", "B": "4", "C": "5", "D": "6", "E": "8"}, "answer": "B", "answerText": "4", "detail": "<div class=\"solution-section\"><div class=\"section-label\">KAVRAMLARI AYIRALIM</div><div class=\"concept-grid\"><div class=\"concept\"><strong>Biyolojik etken</strong><span>İnsanlarda enfeksiyon, alerji veya zehirlenmeye yol açabilen mikroorganizma ve biyolojik kaynaklı etkenlerdir.</span></div><div class=\"concept\"><strong>Mikroorganizma</strong><span>Bakteri, virüs, mantar gibi mikroskobik canlı veya biyolojik ajanları kapsayan genel terimdir.</span></div><div class=\"concept\"><strong>Biyolojik risk</strong><span>Çalışanın biyolojik etkenlere maruz kalması sonucunda ortaya çıkabilecek sağlık riskidir.</span></div></div></div><div class=\"solution-section\"><div class=\"section-label\">ADIM ADIM PROFESYONEL ÇÖZÜM</div><p><b>1. Sorunun odağı:</b> Soru, verilen seçenekler arasında doğru risk etmeni, ölçüm aracı, birim, mevzuat değeri veya İSG kavramını ayırt etmeyi gerektirir.</p><p><b>2. Doğru seçenek:</b> <span class=\"answer-text\">B — 4</span></p><p><b>3. Gerekçe:</b> Biyolojik etkenler enfeksiyon risk düzeyine göre Grup 1, Grup 2, Grup 3 v let exam = "final";
let pos = 0;
let locked = false;
let right = 0;
let answered = 0;

const $ = id => document.getElementById(id);

function startExam(type){
 exam = type;
 pos = 0;
 locked = false;
 right = 0;
 answered = 0;
 $("start").style.display = "none";
 $("app").style.display = "block";
 render();
 window.scrollTo(0,0);
}

function render(){
 const qs = DATA[exam];
 const q = qs[pos];

 locked = false;
 $("examName").textContent =
   exam === "final" ? "FİNAL SINAVI" : "BÜTÜNLEME SINAVI";
 $("count").textContent = `Soru ${pos+1} / ${qs.length}`;
 $("bar").style.width = ((pos / qs.length) * 100) + "%";
 $("question").textContent = q.question;

 const box = $("options");
 box.innerHTML = "";

 Object.entries(q.options).forEach(([letter,text]) => {
   const b = document.createElement("button");
   b.className = "option";
   b.innerHTML = "<b>" + letter + ")</b> " + escapeHtml(text);
   b.onclick = () => answer(letter,b);
   box.appendChild(b);
 });

 $("result").innerHTML = "";
 $("solution").className = "solution";
 $("solution").innerHTML = "";
 $("prev").disabled = pos === 0;
 $("next").disabled = true;
 $("next").textContent = pos === qs.length-1 ? "Bitir →" : "Sonraki →";
}

function answer(selected, clicked){
 if(locked) return;
 locked = true;
 answered++;

 const q = DATA[exam][pos];
 const ok = selected === q.answer;

 if(ok) right++;

 document.querySelectorAll(".option").forEach(b => {
   b.disabled = true;
   const l = b.textContent.trim().charAt(0);
   if(l === q.answer) b.classList.add("correct");
 });

 if(!ok) clicked.classList.add("wrong");

 $("result").innerHTML =
   `<div class="result ${ok ? "good" : "bad"}">
      ${ok ? "✓ DOĞRU" : "✕ YANLIŞ"}
      ${ok ? "" : " — Doğru cevap: " + q.answer}
    </div>`;

 $("solution").className = "solution show";
 $("solution").innerHTML =
   `<div class="solution-head">Mantıksal Çözüm ve Kavram Açıklamaları</div>
    <div class="solution-body">${q.detail}</div>`;

 $("next").disabled = false;
}

function nextQ(){
 const qs = DATA[exam];
 if(pos < qs.length-1){
   pos++;
   render();
   window.scrollTo({top:0,behavior:"smooth"});
 } else {
   $("bar").style.width = "100%";
   $("question").innerHTML =
      `<div style="text-align:center;padding:25px 0">
        <h2>Sınav Tamamlandı</h2>
        <p>Doğru: <b>${right}</b> · Cevaplanan: <b>${answered}</b> ·
        Başarı: <b>%${answered ? Math.round(right/answered*100) : 0}</b></p>
       </div>`;
   $("options").innerHTML = "";
   $("result").innerHTML = "";
   $("solution").className = "solution";
   $("solution").innerHTML = "";
   $("next").disabled = true;
 }
}

function prevQ(){
 if(pos>0){
   pos--;
   render();
   window.scrollTo({top:0,behavior:"smooth"});
 }
}

function escapeHtml(s){
 return String(s)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}
